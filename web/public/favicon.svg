<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="KubeRight">
  <title>KubeRight</title>
  <defs>
    <linearGradient id="kr-tile" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#143550"/>
      <stop offset="1" stop-color="#07111c"/>
    </linearGradient>
    <linearGradient id="kr-signal" x1="14" y1="50" x2="46" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#20a78f"/>
      <stop offset="1" stop-color="#9df3e1"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#kr-tile)"/>
  <!-- A resource bar, and usage arms meeting at the right size: an original K. -->
  <rect x="13" y="13" width="9.5" height="38" rx="4.75" fill="url(#kr-signal)"/>
  <path d="M40.5 19.5 L29 32 L45 49.5" fill="none" stroke="url(#kr-signal)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- The right-size target the signal rises to. -->
  <circle cx="50" cy="13" r="6" fill="#ffb45e"/>
</svg>
