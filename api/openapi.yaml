        pagination: { $ref: "#/components/schemas/Pagination" }
        status: { $ref: "#/components/schemas/Availability" }

    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, timestamp, actor, action, resource, outcome, requestId]
      properties:
        id: { type: string }
        timestamp: { type: string, format: date-time }
        actor: { type: string }
        action: { type: string }
        resource: { type: string }
        namespace: { type: string }
        outcome: { type: string }
        requestId: { type: string }

    AuditCollection:
      type: object
      additionalProperties: false
      required: [items, pagination, status]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        pagination:
          $ref: "#/components/schemas/Pagination"
        status:
          $ref: "#/components/schemas/Availability"

    IntegrationCollection:
      type: object
      additionalProperties: false
      required: [items, pagination, status]
      properties:
        items:
          type: array
          description: Live health of each integration, checked concurrently with a three-second timeout.
          items:
            $ref: "#/components/schemas/DependencyStatus"
        pagination:
          $ref: "#/components/schemas/Pagination"
        status:
          $ref: "#/components/schemas/Availability"

    ErrorResponse:
      type: object
      additionalProperties: false
