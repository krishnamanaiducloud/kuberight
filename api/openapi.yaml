        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }

    BuiltInPolicy:
      type: object
      additionalProperties: false
      required: [name, builtIn, default, description, policy]
      properties:
        name: { type: string, enum: [conservative, balanced, aggressive] }
        builtIn: { type: boolean, const: true }
        default:
          type: boolean
          description: True for the profile used when a request names none.
        description: { type: string }
        policy: { $ref: "#/components/schemas/Policy" }

    PersistedPolicyListItem:
      type: object
      additionalProperties: false
      required: [id, name, builtIn, default, scope, priority, enabled, policy, version, createdAt, createdBy, updatedAt, updatedBy]
      properties:
        id: { type: string, pattern: '^pol_[0-9a-f]{32}$' }
        name: { type: string }
        builtIn: { type: boolean, const: false }
        default: { type: boolean, const: false }
        description: { type: string }
        scope: { $ref: "#/components/schemas/PolicyScope" }
        priority: { type: integer, minimum: -1000, maximum: 1000 }
        enabled: { type: boolean }
        policy: { $ref: "#/components/schemas/Policy" }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }

    PolicyCollection:
      type: object
      additionalProperties: false
      required: [items, pagination, status]
      properties:
        items:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/BuiltInPolicy"
              - $ref: "#/components/schemas/PersistedPolicyListItem"
        pagination: { $ref: "#/components/schemas/Pagination" }
        status: { $ref: "#/components/schemas/Availability" }

    PolicyMutationRequest:
      type: object
      additionalProperties: false
      required: [name, scope, enabled, policy]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        description: { type: string, maxLength: 2048 }
        scope: { $ref: "#/components/schemas/PolicyScope" }
        priority: { type: integer, minimum: -1000, maximum: 1000, default: 0 }
        enabled: { type: boolean }
        policy: { $ref: "#/components/schemas/Policy" }

    PolicyUpdateRequest:
      type: object
      additionalProperties: false
      required: [name, scope, enabled, policy, version]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        description: { type: string, maxLength: 2048 }
        scope: { $ref: "#/components/schemas/PolicyScope" }
        priority: { type: integer, minimum: -1000, maximum: 1000, default: 0 }
        enabled: { type: boolean }
        policy: { $ref: "#/components/schemas/Policy" }
        version: { type: integer, minimum: 1 }

    PolicyResolution:
      type: object
      additionalProperties: false
      required: [source, policy, subject]
      properties:
        source: { type: string, enum: [built_in, persistent] }
        name: { type: string }
        builtIn: { type: boolean }
        matchedPolicy: { $ref: "#/components/schemas/PolicyRecord" }
        policy: { $ref: "#/components/schemas/Policy" }
        subject: { $ref: "#/components/schemas/PolicyScope" }
        precedence:
          type: array
          items: { $ref: "#/components/schemas/PolicyScopeLevel" }

    VersionRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }

    FleetScope:
      type: object
      additionalProperties: false
      properties:
        cluster: { type: string, maxLength: 253 }
        namespaces:
          type: array
          maxItems: 1000
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 253 }
        kinds:
          type: array
          maxItems: 32
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 253 }
        filter: { type: string, maxLength: 512 }

    FleetScheduleRequest:
      type: object
      additionalProperties: false
      required: [name, enabled, intervalSeconds, scope, windowSeconds]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        enabled: { type: boolean }
        intervalSeconds: { type: integer, minimum: 300, maximum: 2592000 }
        scope: { $ref: "#/components/schemas/FleetScope" }
        policyId: { type: string, pattern: '^pol_[0-9a-f]{32}$' }
        windowSeconds: { type: integer, minimum: 3600, maximum: 2592000 }
        nextRunAt: { type: string, format: date-time }

    FleetScheduleUpdateRequest:
      type: object
      additionalProperties: false
      required: [name, enabled, intervalSeconds, scope, windowSeconds, version]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        enabled: { type: boolean }
        intervalSeconds: { type: integer, minimum: 300, maximum: 2592000 }
        scope: { $ref: "#/components/schemas/FleetScope" }
        policyId: { type: string, pattern: '^pol_[0-9a-f]{32}$' }
        windowSeconds: { type: integer, minimum: 3600, maximum: 2592000 }
        nextRunAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }

    FleetSchedule:
      type: object
      additionalProperties: false
      required: [id, name, enabled, intervalSeconds, scope, windowSeconds, nextRunAt, version, createdAt, createdBy, updatedAt, updatedBy]
      properties:
        id: { type: string, pattern: '^fsc_[0-9a-f]{32}$' }
        name: { type: string }
        enabled: { type: boolean }
        intervalSeconds: { type: integer, minimum: 300, maximum: 2592000 }
        scope: { $ref: "#/components/schemas/FleetScope" }
        policyId: { type: string, pattern: '^pol_[0-9a-f]{32}$' }
        windowSeconds: { type: integer, minimum: 3600, maximum: 2592000 }
        nextRunAt: { type: string, format: date-time }
        lastRunAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }

    FleetScheduleCollection:
      type: object
      additionalProperties: false
      required: [items, pagination, status]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FleetSchedule" }
        pagination: { $ref: "#/components/schemas/Pagination" }
        status: { $ref: "#/components/schemas/Availability" }

    FleetScanStatus:
      type: string
      enum: [queued, running, completed, failed, canceled]

    FleetScanRequest:
      type: object
      additionalProperties: false
      required: [scope, windowSeconds]
      properties:
        scope: { $ref: "#/components/schemas/FleetScope" }
        policyId: { type: string, pattern: '^pol_[0-9a-f]{32}$' }
        windowSeconds: { type: integer, minimum: 3600, maximum: 2592000 }
        maxAttempts: { type: integer, minimum: 1, maximum: 10, default: 3 }

    FleetScan:
      type: object
      additionalProperties: false
      required: [id, scheduledFor, scope, windowSeconds, status, expected, processed, succeeded, failed, attempt, maxAttempts, createdAt, createdBy]
      properties:
        id: { type: string, pattern: '^fsn_[0-9a-f]{32}$' }
        scheduleId: { type: string, pattern: '^fsc_[0-9a-f]{32}$' }
