        scope: { $ref: "#/components/schemas/FleetScope" }
        policyId: { type: string, pattern: '^pol_[0-9a-f]{32}$' }
        windowSeconds: { type: integer, minimum: 3600, maximum: 2592000 }
        status: { $ref: "#/components/schemas/FleetScanStatus" }
        expected: { type: integer, minimum: 0 }
        processed: { type: integer, minimum: 0 }
        succeeded: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        attempt: { type: integer, minimum: 0 }
        maxAttempts: { type: integer, minimum: 1, maximum: 10 }
        leaseOwner: { type: string }
        leaseExpiresAt: { type: string, format: date-time }
        lastError: { type: string }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        cancellationAt: { type: string, format: date-time }

    FleetScanCollection:
      type: object
      additionalProperties: false
      required: [items, pagination, status]
      properties:
        items:
          type: array
