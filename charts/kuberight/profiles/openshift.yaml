# OpenShift profile. The image runs under any non-root UID the restricted SCC assigns.
replicaCount: 1
# KubeRight finds OpenShift monitoring on its own (Thanos Querier, with the
# pod's ServiceAccount token and service CA); this grants the read access.
prometheus:
  openshiftMonitoring: true
autoscaling:
  enabled: false
route:
  enabled: true
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
ingress:
  enabled: false
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        # The API and dashboard.
        - protocol: TCP
          port: 8080
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
