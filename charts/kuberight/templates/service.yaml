apiVersion: v1
kind: Service
metadata:
  name: {{ include "kuberight.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kuberight.labels" . | nindent 4 }}
  {{- with (mergeOverwrite (dict) .Values.commonAnnotations .Values.service.annotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  selector:
    {{- include "kuberight.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
