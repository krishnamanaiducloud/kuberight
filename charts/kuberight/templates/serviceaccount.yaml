{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kuberight.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kuberight.labels" . | nindent 4 }}
  {{- $annotations := mergeOverwrite (dict) .Values.commonAnnotations .Values.serviceAccount.annotations }}
  {{- if eq .Values.auth.mode "openshift" }}
  {{- /* Makes the ServiceAccount the OAuth client that returns users to the Route. */}}
  {{- $_ := set $annotations "serviceaccounts.openshift.io/oauth-redirectreference.primary" (toJson (dict "kind" "OAuthRedirectReference" "apiVersion" "v1" "reference" (dict "kind" "Route" "name" (include "kuberight.fullname" .)))) }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- $pullSecrets := concat .Values.global.imagePullSecrets .Values.imagePullSecrets }}
{{- with $pullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
