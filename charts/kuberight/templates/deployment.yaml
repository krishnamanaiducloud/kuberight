{{- include "kuberight.validateValues" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kuberight.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kuberight.labels" . | nindent 4 }}
  {{- $annotations := mergeOverwrite (dict) .Values.commonAnnotations .Values.deploymentAnnotations }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "kuberight.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kuberight.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ toJson .Values.config | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kuberight.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- $pullSecrets := concat .Values.global.imagePullSecrets .Values.imagePullSecrets }}
      {{- with $pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      containers:
        - name: kuberight
          image: {{ include "kuberight.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: KUBERIGHT_LISTEN_ADDR
              value: ":8080"
            {{- with .Values.basePath }}
            - name: KUBERIGHT_BASE_PATH
              value: {{ . | quote }}
            {{- end }}
            # The Go runtime keeps its heap under 85% of this limit.
            - name: KUBERIGHT_MEMORY_LIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: kuberight
                  resource: limits.memory
            - name: KUBERIGHT_OPERATION_MODE
              value: {{ .Values.operationMode | quote }}
            - name: KUBERIGHT_INVENTORY_ENABLED
              value: {{ .Values.inventory.enabled | quote }}
            - name: KUBERIGHT_CLUSTER_ID
              value: {{ default (include "kuberight.fullname" .) .Values.inventory.clusterID | quote }}
            - name: KUBERIGHT_INVENTORY_RESYNC
              value: {{ .Values.inventory.resync | quote }}
            - name: KUBERIGHT_KUBERNETES_QPS
              value: {{ .Values.inventory.qps | quote }}
            - name: KUBERIGHT_KUBERNETES_BURST
              value: {{ .Values.inventory.burst | quote }}
            {{- if eq .Values.rbac.scope "namespace" }}
            - name: KUBERIGHT_INVENTORY_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            {{- end }}
            {{- if .Values.database.enabled }}
            - name: KUBERIGHT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.key | quote }}
            - name: KUBERIGHT_DATABASE_MIGRATE
              # Schema changes are owned by the bounded migration Job. Every
              # serving replica verifies the exact embedded schema read-only.
              value: "false"
            - name: KUBERIGHT_DATABASE_MAX_CONNS
              value: {{ .Values.database.maxConns | quote }}
            {{- end }}
            {{- with .Values.prometheus.url }}
            - name: KUBERIGHT_PROMETHEUS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if and .Values.prometheus.url .Values.prometheus.bearerTokenFile }}
            - name: KUBERIGHT_PROMETHEUS_BEARER_TOKEN_FILE
              value: {{ .Values.prometheus.bearerTokenFile | quote }}
            {{- end }}
            {{- if and .Values.prometheus.url .Values.prometheus.caFile }}
            - name: KUBERIGHT_PROMETHEUS_CA_FILE
              value: {{ .Values.prometheus.caFile | quote }}
            {{- end }}
            {{- if and .Values.prometheus.url .Values.prometheus.tenantNamespace }}
            - name: KUBERIGHT_PROMETHEUS_TENANT_NAMESPACE
              value: {{ .Values.prometheus.tenantNamespace | quote }}
            {{- end }}
            {{- if not .Values.prometheus.discovery }}
            - name: KUBERIGHT_PROMETHEUS_DISCOVERY
              value: "false"
            {{- end }}
            - name: KUBERIGHT_PROMETHEUS_TIMEOUT
              value: {{ .Values.prometheus.timeout | quote }}
            - name: KUBERIGHT_PROMETHEUS_MAX_IN_FLIGHT
              value: {{ .Values.prometheus.maxInFlight | quote }}
            {{- if or (and .Values.prometheus.url .Values.prometheus.allowHTTP) (and .Values.cost.opencost.url .Values.cost.opencost.allowHTTP) (and .Values.gitops.apiURL .Values.gitops.allowHTTP) }}
            - name: KUBERIGHT_ALLOW_INSECURE_UPSTREAMS
              value: "true"
            {{- end }}
            - name: KUBERIGHT_RECOMMENDATION_WINDOW
              value: {{ .Values.recommendations.window | quote }}
            - name: KUBERIGHT_RECOMMENDATION_STEP
              value: {{ .Values.recommendations.step | quote }}
            - name: KUBERIGHT_DEFAULT_SCAN_INTERVAL
              value: {{ .Values.defaultScanInterval | quote }}
            - name: KUBERIGHT_FORECAST_WINDOW
              value: {{ .Values.forecasting.window | quote }}
            - name: KUBERIGHT_FORECAST_STEP
              value: {{ .Values.forecasting.step | quote }}
            {{- with .Values.latencyQuery }}
            - name: KUBERIGHT_LATENCY_QUERY
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.requestRateQuery }}
            - name: KUBERIGHT_REQUEST_RATE_QUERY
              value: {{ . | quote }}
            {{- end }}
            - name: KUBERIGHT_VERIFICATION_INTERVAL
              value: {{ .Values.verification.interval | quote }}
            - name: KUBERIGHT_VERIFICATION_EARLY_INTERVAL
              value: {{ .Values.verification.earlyInterval | quote }}
            {{- if .Values.exportRecommendationMetrics }}
            - name: KUBERIGHT_EXPORT_RECOMMENDATION_METRICS
              value: "true"
            {{- end }}
            {{- with .Values.gitops.provider }}
            - name: KUBERIGHT_GITOPS_PROVIDER
              value: {{ . | quote }}
            {{- with $.Values.gitops.apiURL }}
            - name: KUBERIGHT_GITOPS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with $.Values.gitops.repository }}
            - name: KUBERIGHT_GITOPS_REPOSITORY
              value: {{ . | quote }}
            {{- end }}
            - name: KUBERIGHT_GITOPS_BASE_BRANCH
              value: {{ $.Values.gitops.baseBranch | quote }}
            - name: KUBERIGHT_GITOPS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.gitops.token.existingSecret | quote }}
                  key: {{ $.Values.gitops.token.key | quote }}
            {{- end }}
            {{- with .Values.webhook.existingSecret }}
            - name: KUBERIGHT_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.webhook.urlKey | quote }}
            - name: KUBERIGHT_WEBHOOK_FORMAT
              value: {{ $.Values.webhook.format | quote }}
            {{- if $.Values.webhook.signingSecretKey }}
            - name: KUBERIGHT_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.webhook.signingSecretKey | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.cost.cpuCoreHour }}
            - name: KUBERIGHT_COST_CPU_CORE_HOUR
              value: {{ .Values.cost.cpuCoreHour | quote }}
            - name: KUBERIGHT_COST_MEMORY_GIB_HOUR
              value: {{ .Values.cost.memoryGiBHour | quote }}
            - name: KUBERIGHT_COST_CURRENCY
              value: {{ .Values.cost.currency | quote }}
            {{- end }}
            {{- with .Values.cost.opencost.url }}
            - name: KUBERIGHT_OPENCOST_URL
              value: {{ . | quote }}
            {{- if not $.Values.cost.cpuCoreHour }}
            - name: KUBERIGHT_COST_CURRENCY
              value: {{ $.Values.cost.currency | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.secretEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- $configMapName := default (include "kuberight.fullname" .) .Values.config.existingConfigMap }}
          {{- if or .Values.config.data .Values.config.existingConfigMap .Values.extraEnvFrom }}
          envFrom:
            {{- if or .Values.config.data .Values.config.existingConfigMap }}
            - configMapRef:
                name: {{ $configMapName }}
            {{- end }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "kuberight.selectorLabels" . | nindent 14 }}
        {{- with .Values.topologySpreadConstraints.extra }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
