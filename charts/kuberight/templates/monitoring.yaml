{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "kuberight.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kuberight.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "kuberight.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .Values.metrics.path }}
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
      {{- with .Values.metrics.serviceMonitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.metrics.serviceMonitor.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- if and .Values.metrics.enabled .Values.metrics.prometheusRule.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kuberight.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kuberight.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: kuberight.availability
      rules:
        - alert: KubeRightDeploymentUnavailable
          expr: kube_deployment_status_replicas_unavailable{namespace={{ .Release.Namespace | quote }},deployment={{ include "kuberight.fullname" . | quote }}} > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: KubeRight has unavailable replicas
            runbook_url: https://github.com/krishnamanaiducloud/kuberight/blob/main/docs/operations-runbook.md
        - alert: KubeRightHighHTTPErrorRate
          expr: sum(rate(kuberight_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(kuberight_http_requests_total[5m])), 1) > 0.05
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: KubeRight HTTP 5xx rate exceeds 5 percent
            runbook_url: https://github.com/krishnamanaiducloud/kuberight/blob/main/docs/operations-runbook.md
    - name: kuberight.recommendations
      rules:
        - alert: KubeRightRecommendationRegressed
          # Each API replica verifies independently, so take the largest count.
          expr: max(kuberight_recommendation_regressions{namespace={{ .Release.Namespace | quote }}}) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: An applied KubeRight recommendation was followed by OOM kills, throttling, restarts, or slower responses
            description: Open the recommendation's verification (GET /api/v1/recommendations/{id}/verification) or the Correlation analysis view, and consider restoring the previous requests and limits.
            runbook_url: https://github.com/krishnamanaiducloud/kuberight/blob/main/README.md#correlation-analysis-and-recommendation-accuracy
    {{- if eq .Values.operationMode "apply" }}
    - name: kuberight.automation
      rules:
        - alert: KubeRightAutomatedChangeFailed
          expr: sum(increase(kuberight_automation_changes_total{namespace={{ .Release.Namespace | quote }},outcome="failed"}[30m])) > 0
          labels:
            severity: warning
          annotations:
            summary: An automated KubeRight change or rollback could not be applied
            description: Check the automation audit events and GET /api/v1/automation for the failing workload. A conflict means the workload changed after evaluation; KubeRight re-evaluates on the next pass.
            runbook_url: https://github.com/krishnamanaiducloud/kuberight/blob/main/README.md#continuous-rightsizing
        - alert: KubeRightAutomatedChangeRolledBack
          expr: sum(increase(kuberight_automation_changes_total{namespace={{ .Release.Namespace | quote }},action="rollback",outcome="rolled_back"}[1h])) > 0
          labels:
            severity: warning
          annotations:
            summary: KubeRight rolled back an automated change after a verified regression
            description: The previous requests and limits were restored. Review the recommendation's verification before approving new advice for that container.
            runbook_url: https://github.com/krishnamanaiducloud/kuberight/blob/main/README.md#continuous-rightsizing
        - alert: KubeRightAutomationStalled
          # A pass runs every automation.interval on the replica that holds the lock.
          expr: time() - max(kuberight_automation_last_pass_timestamp_seconds{namespace={{ .Release.Namespace | quote }}}) > 3 * {{ include "kuberight.durationSeconds" .Values.automation.interval }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: No KubeRight automation pass has completed for three intervals
            runbook_url: https://github.com/krishnamanaiducloud/kuberight/blob/main/README.md#continuous-rightsizing
    {{- end }}
{{- end }}
