{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kuberight.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kuberight.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kuberight.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egressIsolation }}
    - Egress
    {{- end }}
  {{- $monitoringIngress := and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
  {{- if or .Values.networkPolicy.ingressFromSameNamespace .Values.networkPolicy.ingress $monitoringIngress }}
  ingress:
    {{- if .Values.networkPolicy.ingressFromSameNamespace }}
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    {{- if $monitoringIngress }}
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.monitoring.namespaceSelector | nindent 12 }}
          {{- with .Values.networkPolicy.monitoring.podSelector }}
          podSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    {{- with .Values.networkPolicy.ingress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
  {{- if .Values.networkPolicy.egressIsolation }}
  egress:
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- else }}
    []
    {{- end }}
  {{- end }}
{{- end }}
