{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kuberight.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kuberight.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kuberight.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egressIsolation }}
    - Egress
    {{- end }}
  {{- $monitoringIngress := and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
  {{- if or .Values.networkPolicy.ingressFromSameNamespace .Values.networkPolicy.ingress $monitoringIngress }}
  ingress:
    {{- if .Values.networkPolicy.ingressFromSameNamespace }}
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ include "kuberight.httpPort" . }}
    {{- end }}
    {{- if $monitoringIngress }}
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.monitoring.namespaceSelector | nindent 12 }}
          {{- with .Values.networkPolicy.monitoring.podSelector }}
          podSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      ports:
        - protocol: TCP
          port: {{ include "kuberight.httpPort" . }}
    {{- end }}
    {{- with .Values.networkPolicy.ingress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
  {{- if .Values.networkPolicy.egressIsolation }}
  {{- if not (or .Values.networkPolicy.kubernetesAPI.cidrs .Values.networkPolicy.egress) }}
  {{- fail "networkPolicy.egressIsolation needs the Kubernetes API server: set networkPolicy.kubernetesAPI.cidrs or add an egress rule for it" }}
  {{- end }}
  egress:
    # DNS resolution.
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.dns.podSelector | nindent 12 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- with .Values.networkPolicy.kubernetesAPI.cidrs }}
    # The Kubernetes API server, for inventory, reviews, and apply mode.
    - to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        {{- range $.Values.networkPolicy.kubernetesAPI.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- if .Values.ml.enabled }}
    # The forecasting service in this release.
    - to:
        - podSelector:
            matchLabels:
              {{- include "kuberight.mlSelectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8081
    {{- end }}
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
