{{- if .Values.rbac.create }}
{{- if and (has .Values.auth.mode (list "kubernetes" "oidc")) .Values.rbac.authReviews }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kuberight.clusterScopedName" . }}-auth-reviewer
  labels:
    {{- include "kuberight.labels" . | nindent 4 }}
rules:
  {{- if eq .Values.auth.mode "kubernetes" }}
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  {{- end }}
  # Every request is authorized with SubjectAccessReview in both modes.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kuberight.clusterScopedName" . }}-auth-reviewer
  labels:
    {{- include "kuberight.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kuberight.clusterScopedName" . }}-auth-reviewer
subjects:
  - kind: ServiceAccount
    name: {{ include "kuberight.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if or .Values.rbac.monitoring.enabled .Values.rbac.extraRules }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ ternary "ClusterRole" "Role" (eq .Values.rbac.scope "cluster") }}
metadata:
  name: {{ if eq .Values.rbac.scope "cluster" }}{{ include "kuberight.clusterScopedName" . }}{{ else }}{{ include "kuberight.fullname" . }}{{ end }}-workloads
  {{- if eq .Values.rbac.scope "namespace" }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    {{- include "kuberight.labels" . | nindent 4 }}
rules:
  {{- if .Values.rbac.monitoring.enabled }}
  {{- if eq .Values.rbac.scope "cluster" }}
  - apiGroups: [""]
    resources: ["nodes", "namespaces"]
    verbs: ["list"]
  # Read-only Karpenter NodePools for node-impact estimates; absent CRDs are ignored.
  - apiGroups: ["karpenter.sh"]
    resources: ["nodepools"]
    verbs: ["list"]
  # Read-only OpenShift Machines verify each node's MachineSet; without them
  # membership is inferred from Machine names.
  - apiGroups: ["machine.openshift.io"]
    resources: ["machines"]
    verbs: ["list"]
  # Node-group size limits: OpenShift MachineAutoscalers and the status that
  # Cluster Autoscaler writes; absent CRDs and ConfigMaps are ignored.
  - apiGroups: ["autoscaling.openshift.io"]
    resources: ["machineautoscalers"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cluster-autoscaler-status"]
    verbs: ["get"]
  # PodDisruptionBudgets that allow no evictions keep their pods, and so their
  # nodes, in node-impact estimates.
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["list"]
  {{- end }}
  # Pod ownerReferences attribute container metrics to exact controllers;
  # pod names are never used as an ownership heuristic.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["list"]
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects", "scaledjobs"]
    verbs: ["list"]
  - apiGroups: ["autoscaling.k8s.io"]
    resources: ["verticalpodautoscalers"]
    verbs: ["list"]
  # Recommendations are checked against namespace LimitRanges and
  # ResourceQuotas before they can be approved.
  - apiGroups: [""]
    resources: ["limitranges", "resourcequotas"]
    verbs: ["list"]
  {{- end }}
  {{- with .Values.rbac.extraRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ ternary "ClusterRoleBinding" "RoleBinding" (eq .Values.rbac.scope "cluster") }}
metadata:
  name: {{ if eq .Values.rbac.scope "cluster" }}{{ include "kuberight.clusterScopedName" . }}{{ else }}{{ include "kuberight.fullname" . }}{{ end }}-workloads
  {{- if eq .Values.rbac.scope "namespace" }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    {{- include "kuberight.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ ternary "ClusterRole" "Role" (eq .Values.rbac.scope "cluster") }}
  name: {{ if eq .Values.rbac.scope "cluster" }}{{ include "kuberight.clusterScopedName" . }}{{ else }}{{ include "kuberight.fullname" . }}{{ end }}-workloads
subjects:
  - kind: ServiceAccount
    name: {{ include "kuberight.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.prometheus.openshiftMonitoring }}
---
{{- if eq .Values.rbac.scope "cluster" }}
# Thanos Querier answers PromQL for every namespace to cluster-monitoring-view,
# a read-only role that OpenShift ships.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kuberight.clusterScopedName" . }}-monitoring-view
  labels:
    {{- include "kuberight.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: {{ include "kuberight.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- else }}
# The Thanos Querier tenancy port answers for one namespace to whoever may
# read that namespace's pod metrics.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kuberight.fullname" . }}-monitoring-view
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kuberight.labels" . | nindent 4 }}
rules:
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kuberight.fullname" . }}-monitoring-view
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kuberight.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kuberight.fullname" . }}-monitoring-view
subjects:
  - kind: ServiceAccount
    name: {{ include "kuberight.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
