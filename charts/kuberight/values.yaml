# KubeRight chart defaults. See docs/helm-values.md for the complete contract.
global:
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

namespace:
  # Helm users should prefer --create-namespace. Standalone rendering enables this.
  create: false
  labels: {}
  annotations: {}

# Without database.enabled, recommendation, idempotency, and audit state is
# process-local and the chart refuses more than one replica.
replicaCount: 1

image:
  repository: mohankrishna999/kuberight
  # Empty means Chart.appVersion. Release workflows publish immutable semver tags.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# observe: inventory and analysis only. recommend: also stores
# recommendations and reviews. KubeRight never changes workloads in either.
operationMode: recommend

# URL prefix to serve the dashboard and API under, such as /kuberight, when an
# Ingress or Route shares a host by path. Empty serves them at the root. Set
# the Ingress path (or route.path) to the same prefix; it is not stripped.
basePath: ""

inventory:
  enabled: true
  # Empty uses the release name as the stable cluster identity.
  clusterID: ""
  resync: 10m
  qps: 50
  burst: 100

# External PostgreSQL for durable, shared recommendation, review, and audit
# state. The chart never deploys a database. The Secret key must contain a
# postgres:// connection string; prefer sslmode=verify-full.
database:
  enabled: false
  existingSecret: ""
  key: url
  # Run a bounded pre-install/pre-upgrade Job that applies embedded,
  # checksummed migrations under an advisory lock. Serving pods always verify
  # the schema and never execute DDL. When false, installation succeeds only
  # when an operator has already migrated the database.
  migrate: true
  migrationJob:
    # Empty reuses database.existingSecret. Production installations should
    # provide a separate URL for a short-lived role allowed to execute DDL,
    # while the serving URL is restricted to application DML.
    existingSecret: ""
    key: url
    activeDeadlineSeconds: 300
    backoffLimit: 3
    annotations: {}
  maxConns: 10

# Prometheus with cAdvisor container metrics (and optionally
# kube-state-metrics for restart and OOM history).
prometheus:
  # Existing Prometheus-compatible query endpoint. KubeRight never installs
  # one. Empty with discovery enabled uses the cluster's own monitoring when
  # KubeRight can find it: on OpenShift, Thanos Querier with the pod's
  # ServiceAccount token and service CA (see openshiftMonitoring below).
  url: ""
  discovery: true
  # Permit an in-cluster http:// URL. Prefer HTTPS. A bearer token is never
  # sent over HTTP.
  allowHTTP: false
  # Authentication and trust for a protected endpoint; used only with url.
  # bearerTokenFile is re-read as it rotates, so the pod's ServiceAccount
  # token (/var/run/secrets/kubernetes.io/serviceaccount/token) works.
  bearerTokenFile: ""
  # PEM bundle trusted in addition to the system roots.
  caFile: ""
  # Sent as the namespace parameter that multi-tenant query proxies require.
  tenantNamespace: ""
  timeout: 10s
  # Global bound across all recommendation/signal requests in one API pod.
  maxInFlight: 8
  # Lets the ServiceAccount query OpenShift monitoring: cluster-monitoring-view
  # with rbac.scope=cluster, or pod metrics of the release namespace (the
  # Thanos Querier tenancy port) with rbac.scope=namespace. Read-only.
  openshiftMonitoring: false

# Usage lookback and resolution for generated recommendations.
recommendations:
  window: 168h
  step: 5m

# KubeRight creates a scan schedule with this interval when none exists, so
# recommendations appear without anyone queueing a scan. It scans every
# namespace the inventory can see over recommendations.window. "0s" creates
# none; once any schedule exists, schedules are managed from the dashboard.
defaultScanInterval: 6h

# Usage lookback and resolution sent to the forecasting service.
forecasting:
  window: 336h
  step: 1h

# Operator-supplied unit prices for request-based savings estimates. Leave
# both empty to disable estimates; KubeRight never invents prices.
cost:
  cpuCoreHour: ""
  memoryGiBHour: ""
  currency: USD
  # Price CPU and memory per namespace from OpenCost allocation data (cloud
  # or custom pricing), for example http://opencost.opencost.svc:9003.
  # The prices above remain the fallback. Estimates stay request-based; they
  # are not billing or realized savings.
  opencost:
    url: ""
    # Permit an in-cluster http:// URL. Prefer HTTPS.
    allowHTTP: false

# Correlate an application latency series with resource signals. A one-line
# PromQL template in seconds using $namespace, $workload, or $container.
latencyQuery: ""

# Correlate traffic with usage, latency, and replicas. A one-line PromQL
# template in requests per second using $namespace, $workload, or $container,
# for example sum(rate(http_requests_total{namespace="$namespace",service="$workload"}[5m])).
requestRateQuery: ""

# Post-change verification of approved recommendations: how often each API
# replica checks for OOM kills, throttling, restarts, and latency after the
# approved values go live. "0s" disables the background check; the
# verification endpoint still works on demand. Changes in their first hour
# are rechecked every earlyInterval: from five minutes after the change, an
# OOM kill, a restart, or throttling or CPU or memory pressure that is high
# and well above the baseline marks the change regressed and raises an alert;
# KubeRight never changes the workload itself. "0s" leaves new changes to the
# full pass.
verification:
  interval: 15m
  earlyInterval: 2m

# Recommendation lifecycle events for Slack, Teams, PagerDuty, Argo Events,
# or CI. The Secret holds the URL and an optional HMAC signing secret.
webhook:
  existingSecret: ""
  urlKey: url
  signingSecretKey: ""
  format: json

# Pull requests for GitOps-managed workloads. An approved recommendation can
# be proposed as a pull request that edits the manifest named by the
# workload annotation kuberight.io/gitops-path (repository and base branch
# from kuberight.io/gitops-repository and kuberight.io/gitops-base-branch or
# the defaults below). The token needs contents and pull-request write access.
gitops:
  # "", github (github.com or GitHub Enterprise), gitlab (gitlab.com or
  # self-managed; merge requests), or gitea (Gitea or Forgejo).
  provider: ""
  # API base. Empty is https://api.github.com for github and
  # https://gitlab.com/api/v4 for gitlab; required for gitea,
  # for example https://git.example.com/api/v1.
  apiURL: ""
  allowHTTP: false
  repository: ""
  baseBranch: main
  token:
    existingSecret: ""
    key: token

# Export one gauge per container recommendation on /metrics for Grafana,
# Coralogix, Datadog, or any OpenMetrics consumer. /metrics is
# unauthenticated, so keep it reachable only by your monitoring stack.
exportRecommendationMetrics: false

serviceAccount:
  create: true
  automountServiceAccountToken: true
  annotations: {}
  name: ""

rbac:
  create: true
  # namespace is the least-privilege default. Use cluster only for fleet-wide inventory.
  scope: namespace
  monitoring:
    enabled: true
  extraRules: []

service:
  type: ClusterIP
  port: 8080
  annotations: {}
  clusterIP: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: kuberight.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

route:
  enabled: false
  host: ""
  annotations: {}
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

config:
  existingConfigMap: ""
  data: {}

secretEnv: []
extraEnv: []
extraEnvFrom: []

podAnnotations: {}
podLabels: {}
deploymentAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1
    # Cluster-wide scans hold inventory lists and Prometheus history together.
    memory: 1Gi

probes:
  startup:
    enabled: true
    failureThreshold: 30
    periodSeconds: 2
  readiness:
    enabled: true
    initialDelaySeconds: 2
    periodSeconds: 10
    # /readyz checks the Kubernetes API, the store, and Prometheus.
    timeoutSeconds: 5
    failureThreshold: 3
  liveness:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 20
    # A busy scan must not get the pod restarted: 2 minutes of failures.
    timeoutSeconds: 5
    failureThreshold: 6

terminationGracePeriodSeconds: 30

podDisruptionBudget:
  enabled: true
  minAvailable: 1
  maxUnavailable: ""

autoscaling:
  # Requires database.enabled; the in-process store is not shared.
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: ""
  behavior: {}

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway
  extra: []

# Linux nodes by default, so mixed Windows and Linux clusters (AKS, EKS)
# never schedule these Linux images onto Windows nodes.
nodeSelector:
  kubernetes.io/os: linux
tolerations: []
# Static host entries for the pod, for example an identity provider or Git
# server name that internal DNS does not resolve.
hostAliases: []
affinity: {}
priorityClassName: ""
runtimeClassName: ""

networkPolicy:
  enabled: true
  # Ingress is limited to same-namespace pods unless additional peers are supplied.
  ingressFromSameNamespace: true
  ingress: []
  # Applied automatically when a ServiceMonitor is enabled. Adjust these selectors
  # to match the namespace and pods that run Prometheus in the target cluster.
  monitoring:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    podSelector: {}
  # Egress isolation. When enabled, DNS (the pods selected by dns) is allowed
  # automatically.
  # The Kubernetes API server must be listed in kubernetesAPI.cidrs (its
  # endpoint addresses, for example from
  # `kubectl get endpointslices -n default -l kubernetes.io/service-name=kubernetes`),
  # or the chart refuses to render. Prometheus, PostgreSQL, OpenCost, OIDC,
  # Git hosts, and webhooks need rules in egress.
  egressIsolation: false
  dns:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        k8s-app: kube-dns
  kubernetesAPI:
    cidrs: []
    ports: [443, 6443]
  egress: []

metrics:
  enabled: true
  path: /metrics
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    relabelings: []
    metricRelabelings: []
  prometheusRule:
    enabled: false
    labels: {}
  # A ConfigMap holding the KubeRight Grafana dashboard
  # (dashboards/kuberight.json), labeled for the Grafana dashboard sidecar.
  # Set namespace when the sidecar only watches Grafana's namespace.
  grafanaDashboard:
    enabled: false
    namespace: ""
    labels:
      grafana_dashboard: "1"
    annotations: {}

extraVolumes: []
extraVolumeMounts: []

commonLabels: {}
commonAnnotations: {}
