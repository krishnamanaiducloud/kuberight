name: Required quality gates

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  go:
    name: Go build, test, race, vet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Disposable database for the PostgreSQL store contract and migration
      # tests. Without it those tests skip and the store would be unverified.
      postgres:
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: kuberight
          POSTGRES_PASSWORD: kuberight-ci
          POSTGRES_DB: kuberight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kuberight -d kuberight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      KUBERIGHT_TEST_DATABASE_URL: postgres://kuberight:kuberight-ci@127.0.0.1:5432/kuberight?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject tracked AI instruction and session artifacts
        shell: bash
        run: |
          forbidden="$(git ls-files | grep -Ei '(^|/)(CLAUDE|CODEX|AGENTS)\.md$|(^|/)\.(claude|codex|cursor)(/|$)' || true)"
          if [[ -n "$forbidden" ]]; then
            printf 'Forbidden tracked agent artifacts:\n%s\n' "$forbidden" >&2
            exit 1
          fi
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify committed dependencies
        run: |
          test -s go.sum
          go mod verify
          git diff --exit-code -- go.mod go.sum
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
      - run: go vet ./...
      - name: Unit tests and race detector
        run: go test -race -covermode=atomic -coverprofile=coverage-go.out ./...
      - name: Enforce aggregate Go coverage floor
        shell: bash
        run: |
          coverage=$(go tool cover -func=coverage-go.out | awk '/^total:/ { gsub(/%/, "", $3); print $3 }')
          printf 'aggregate Go statement coverage: %s%%\n' "$coverage"
          awk -v coverage="$coverage" 'BEGIN { exit !(coverage >= 45.0) }'
      - name: Build production entrypoint
        run: go build -trimpath -o /tmp/kuberight ./cmd/kuberight
      - name: Replay historical attribution against Prometheus
        # Evaluates the attribution PromQL in a real Prometheus loaded with
        # synthetic workload lifecycles, instead of asserting query strings.
        shell: bash
        env:
          PROMETHEUS_VERSION: 3.15.1
          PROMETHEUS_SHA256: 6a726885328ad9efebbf36e876ce2fb6225468a71fd1e7ce3ba666d5f4d97a84
        run: |
          archive="prometheus-${PROMETHEUS_VERSION}.linux-amd64"
          curl --fail --silent --show-error --location --retry 3 -o /tmp/prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/${archive}.tar.gz"
          echo "${PROMETHEUS_SHA256}  /tmp/prometheus.tar.gz" | sha256sum --check -
          tar -xzf /tmp/prometheus.tar.gz -C /tmp
          PROMETHEUS_BIN="/tmp/${archive}/prometheus" PROMTOOL_BIN="/tmp/${archive}/promtool" scripts/attribution-replay.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage
          path: coverage-go.out
          if-no-files-found: error

  api-contract:
    name: API contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r scripts/requirements.txt
      - name: Validate OpenAPI contract
        run: |
          openapi-spec-validator api/openapi.yaml
          python scripts/verify-openapi-contract.py
      - name: Reject breaking API changes after the first release
        shell: bash
        run: |
          set -euo pipefail
          current_ref=${GITHUB_REF_NAME:-}
          base_tag=$(git tag --merged origin/main --list 'v*' --sort=-version:refname \
            | grep -Fxv "$current_ref" | head -n 1 || true)
          if test -z "$base_tag"; then
            echo "No earlier release tag exists; compatibility comparison starts after the first release."
            exit 0
          fi
          git show "${base_tag}:api/openapi.yaml" > /tmp/kuberight-openapi-base.yaml
          python scripts/check-openapi-compat.py /tmp/kuberight-openapi-base.yaml api/openapi.yaml

  frontend:
    name: Frontend lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run lint --prefix web
      - run: npm run typecheck --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web
      - run: npm audit --prefix web --audit-level=high
      - name: Browser contract and accessibility tests
        run: |
          npm exec --prefix web playwright install -- --with-deps chromium
          npm run test:e2e --prefix web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-contract-evidence
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: error
          retention-days: 14

  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go vulnerability database
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r scripts/requirements.txt --strict

  dependency-review:
    name: Pull request dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  helm:
    name: Helm and Kubernetes schemas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1
      - run: helm lint --strict charts/kuberight
      - name: Render every supported profile
        run: |
          mkdir -p /tmp/rendered
          helm template kuberight charts/kuberight --namespace kuberight > /tmp/rendered/default.yaml
          helm template kuberight charts/kuberight --namespace kuberight -f charts/kuberight/profiles/development.yaml > /tmp/rendered/development.yaml
          helm template kuberight charts/kuberight --namespace kuberight -f charts/kuberight/profiles/production.yaml > /tmp/rendered/production.yaml
          helm template kuberight charts/kuberight --namespace kuberight -f charts/kuberight/profiles/openshift.yaml > /tmp/rendered/openshift.yaml
          helm template kuberight charts/kuberight --namespace kuberight \
            -f charts/kuberight/profiles/openshift.yaml \
            -f charts/kuberight/profiles/cluster-wide.yaml \
            > /tmp/rendered/openshift-cluster-wide.yaml
          helm template kuberight charts/kuberight --namespace kuberight -f charts/kuberight/profiles/cluster-wide.yaml > /tmp/rendered/cluster-wide.yaml
          helm template kuberight charts/kuberight --namespace kuberight \
            --set database.enabled=true --set database.existingSecret=kuberight-db --set replicaCount=2 \
            --set prometheus.url=http://prometheus.monitoring.svc:9090 --set prometheus.allowHTTP=true \
            --set cost.cpuCoreHour=0.031 --set cost.memoryGiBHour=0.004 \
            > /tmp/rendered/integrations.yaml
      - name: Reject unsafe integration values
        shell: bash
        run: |
          # "! cmd" does not trip errexit, so each rejection is checked explicitly.
          reject() {
            if helm template kuberight charts/kuberight "$@" >/dev/null 2>&1; then
              echo "chart accepted unsafe values: $*" >&2
              exit 1
            fi
          }
          reject --set replicaCount=2
          reject --set database.enabled=true
          reject --set cost.cpuCoreHour=0.031
          reject --set cost.currency=usd
          reject --set serviceAccount.create=false
          reject --set serviceAccount.automountServiceAccountToken=false
          reject --set prometheus.url=http://prometheus.monitoring.svc:9090 --set prometheus.allowHTTP=true --set prometheus.bearerTokenFile=/var/run/secrets/kubernetes.io/serviceaccount/token
          reject --set prometheus.caFile=/etc/ca.crt
          reject --set autoscaling.enabled=true --set autoscaling.minReplicas=3 --set autoscaling.maxReplicas=2 --set database.enabled=true --set database.existingSecret=kuberight-db
          reject --set prometheus.url=http://prometheus.monitoring.svc:9090
          reject --set misspelledTopLevelValue=true
      - name: Verify committed standalone manifests
        run: scripts/render-manifests.sh --check
      - name: Test alert rules and dashboard queries in promtool
        shell: bash
        env:
          PROMETHEUS_VERSION: 3.15.1
          PROMETHEUS_SHA256: 6a726885328ad9efebbf36e876ce2fb6225468a71fd1e7ce3ba666d5f4d97a84
        run: |
          archive="prometheus-${PROMETHEUS_VERSION}.linux-amd64"
          curl --fail --silent --show-error --location --retry 3 -o /tmp/prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/${archive}.tar.gz"
          echo "${PROMETHEUS_SHA256}  /tmp/prometheus.tar.gz" | sha256sum --check -
          tar -xzf /tmp/prometheus.tar.gz -C /tmp
          PROMTOOL_BIN="/tmp/${archive}/promtool" scripts/verify-monitoring.sh
      - name: Validate core Kubernetes schemas
        run: |
          docker run --rm -v /tmp/rendered:/manifests:ro \
            ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
            -strict -summary -kubernetes-version 1.35.0 \
            /manifests/default.yaml /manifests/development.yaml \
            /manifests/cluster-wide.yaml /manifests/integrations.yaml
      - name: Validate profiles containing extension APIs
        run: |
          docker run --rm -v /tmp/rendered:/manifests:ro \
            ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
            -strict -summary -ignore-missing-schemas -kubernetes-version 1.35.0 \
            /manifests/production.yaml /manifests/openshift.yaml \
            /manifests/openshift-cluster-wide.yaml
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: kuberight-schema
          version: v0.33.0
          node_image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          kubectl_version: v1.35.8
      - name: Kubernetes API server dry-run
        run: |
          kubectl create namespace kuberight
          kubectl apply --server-side --dry-run=server -f deploy/manifests/kuberight.yaml

  containers:
    name: Build, scan, SBOM, smoke, Kind
    needs:
      - go
      - api-contract
      - frontend
      - dependencies
      - secrets
      - helm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build backend/dashboard image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: kuberight:ci
          provenance: false
      - name: Enforce non-root image users
        shell: bash
        run: |
          set -euo pipefail
          for image in kuberight:ci; do
            configured_user="$(docker image inspect --format '{{.Config.User}}' "$image")"
            configured_uid="${configured_user%%:*}"
            if [[ ! "$configured_uid" =~ ^[1-9][0-9]*$ ]]; then
              echo "Image $image has an unsafe configured user: ${configured_user:-<empty>}" >&2
              exit 1
            fi
          done
      - name: Scan backend/dashboard image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kuberight:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          vuln-type: os,library
          version: v0.76.2
      - name: Generate backend/dashboard SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: kuberight:ci
          format: spdx-json
          output-file: kuberight.spdx.json
          artifact-name: kuberight-ci-sbom.spdx.json
      - name: Container smoke tests
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name kuberight-smoke --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -e KUBERIGHT_INVENTORY_ENABLED=false \
            -p 18080:8080 kuberight:ci
          trap 'docker logs kuberight-smoke || true; docker rm -f kuberight-smoke || true' EXIT
          for _ in {1..30}; do curl --fail --silent http://127.0.0.1:18080/healthz && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:18080/readyz
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: kuberight-integration
          version: v0.33.0
          node_image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          kubectl_version: v1.35.8
      - name: Install images into disposable Kind cluster
        run: |
          kubectl create namespace kuberight
          kind load docker-image kuberight:ci --name kuberight-integration
          helm upgrade --install kuberight charts/kuberight \
            --namespace kuberight --wait --timeout 5m \
            --set image.repository=kuberight --set image.tag=ci --set image.pullPolicy=Never \
            --set replicaCount=1 --set podDisruptionBudget.enabled=false \
            --set topologySpreadConstraints.enabled=false
          kubectl -n kuberight rollout status deployment/kuberight --timeout=2m
          kubectl -n kuberight get pods,services
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Live deployed-app browser and accessibility test
        shell: bash
        env:
          KUBERIGHT_E2E_BASE_URL: http://127.0.0.1:18084
        run: |
          set -euo pipefail
          kubectl -n kuberight port-forward service/kuberight 18084:8080 >/tmp/kuberight-port-forward.log 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid" 2>/dev/null || true; cat /tmp/kuberight-port-forward.log' EXIT
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18084/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:18084/readyz >/dev/null
          npm ci --prefix web
          npm exec --prefix web playwright install -- --with-deps chromium
          npm run test:e2e:live --prefix web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-live-kind-evidence
          path: |
            web/playwright-live-report
            web/test-results-live
          if-no-files-found: error
          retention-days: 14

  containers_arm64:
    name: Build, scan, and execute ARM64 images
    needs:
      - containers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build ARM64 backend/dashboard image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: kuberight:ci-arm64
          provenance: false
      - name: Verify ARM64 platforms and non-root users
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          for image in kuberight:ci-arm64; do
            platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")"
            test "$platform" = linux/arm64 || {
              echo "Expected linux/arm64 image, got $platform for $image" >&2
              exit 1
            }
            configured_user="$(docker image inspect --format '{{.Config.User}}' "$image")"
            configured_uid="${configured_user%%:*}"
            if [[ ! "$configured_uid" =~ ^[1-9][0-9]*$ ]]; then
              echo "Image $image has an unsafe configured user: ${configured_user:-<empty>}" >&2
              exit 1
            fi
          done
      - name: Scan ARM64 backend/dashboard image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kuberight:ci-arm64
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          vuln-type: os,library
          version: v0.76.2
      - name: Run ARM64 read-only smoke tests under QEMU
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker logs kuberight-arm64-smoke || true
            docker rm -f kuberight-arm64-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --platform linux/arm64 -d --name kuberight-arm64-smoke \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -e KUBERIGHT_INVENTORY_ENABLED=false \
            -p 18082:8080 kuberight:ci-arm64
          wait_for_url() {
            local url="$1"
            for _ in {1..60}; do
              if curl --fail --silent "$url" >/dev/null; then
                return 0
              fi
              sleep 2
            done
            echo "Timed out waiting for $url" >&2
            return 1
          }
          wait_for_url http://127.0.0.1:18082/healthz
          curl --fail --silent --show-error http://127.0.0.1:18082/readyz

  complete:
    name: All mandatory gates passed
    if: always()
    needs:
      - go
      - api-contract
      - frontend
      - dependencies
      - dependency-review
      - secrets
      - helm
      - containers
      - containers_arm64
    runs-on: ubuntu-latest
    steps:
      - name: Require every mandatory result
        env:
          GO_RESULT: ${{ needs.go.result }}
          API_CONTRACT_RESULT: ${{ needs.api-contract.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          HELM_RESULT: ${{ needs.helm.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
          ARM64_CONTAINERS_RESULT: ${{ needs.containers_arm64.result }}
        run: |
          test "$GO_RESULT" = success
          test "$API_CONTRACT_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$DEPENDENCIES_RESULT" = success
          if [[ "${{ github.event_name }}" = pull_request ]]; then
            test "$DEPENDENCY_REVIEW_RESULT" = success
          else
            test "$DEPENDENCY_REVIEW_RESULT" = skipped
          fi
          test "$SECRETS_RESULT" = success
          test "$HELM_RESULT" = success
          test "$CONTAINERS_RESULT" = success
          test "$ARM64_CONTAINERS_RESULT" = success
