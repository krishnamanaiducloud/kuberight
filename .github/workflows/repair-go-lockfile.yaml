name: Repair Go dependency lockfile
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Generate and verify module checksums
        run: |
          go mod tidy
          go mod download
          go mod verify
          test -s go.sum
          go test ./...
          go vet ./...
          go build ./cmd/kuberight
      - name: Open reviewable dependency repair PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: maintenance/go-dependency-lock
          commit-message: "build: generate verified go.sum"
          title: "build: generate verified Go dependency lockfile"
          body: |
            Generated go.sum in a network-enabled GitHub runner.
            Go tests, vet, and build must pass before this PR is created.
            Review changes and merge only after CI succeeds.
          add-paths: |
            go.mod
            go.sum
