# Source: kuberight/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuberight
  namespace: kuberight
  labels:
    helm.sh/chart: kuberight-0.1.0-rc.1
    app.kubernetes.io/name: kuberight
    app.kubernetes.io/instance: kuberight
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.1.0-rc.1"
    app.kubernetes.io/component: server
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kuberight
      app.kubernetes.io/instance: kuberight
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kuberight
        app.kubernetes.io/instance: kuberight
        app.kubernetes.io/component: server
      annotations:
        checksum/config: 96438f4d01403610ce1e94698560db9c71ae4b2d94a7deba9a16426aa6aec712
    spec:
      serviceAccountName: kuberight
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: kuberight
          image: "mohankrishna999/kuberight:0.1.0-rc.1"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: KUBERIGHT_LISTEN_ADDR
              value: ":8080"
            - name: KUBERIGHT_AUTH_MODE
              value: "kubernetes"
            - name: KUBERIGHT_OPERATION_MODE
              value: "recommend"
            - name: KUBERIGHT_INVENTORY_ENABLED
              value: "true"
            - name: KUBERIGHT_CLUSTER_ID
              value: "kuberight"
            - name: KUBERIGHT_INVENTORY_RESYNC
              value: "10m"
            - name: KUBERIGHT_KUBERNETES_QPS
              value: "10"
            - name: KUBERIGHT_KUBERNETES_BURST
              value: "20"
            - name: KUBERIGHT_INVENTORY_NAMESPACE
              value: "kuberight"
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            limits:
              cpu: 1
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kuberight
              app.kubernetes.io/instance: kuberight
              app.kubernetes.io/component: server

