apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuberight
  namespace: kuberight
  labels:
    helm.sh/chart: kuberight-0.1.0-rc.4
    app.kubernetes.io/name: kuberight
    app.kubernetes.io/instance: kuberight
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.1.0-rc.4"
    app.kubernetes.io/component: server
  annotations:
    image.openshift.io/triggers: '[{"fieldPath":"spec.template.spec.containers[?(@.name==\"oauth-proxy\")].image","from":{"kind":"ImageStreamTag","name":"oauth-proxy:v4.4","namespace":"openshift"}}]'
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kuberight
      app.kubernetes.io/instance: kuberight
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kuberight
        app.kubernetes.io/instance: kuberight
        app.kubernetes.io/component: server
      annotations:
        checksum/config: 96438f4d01403610ce1e94698560db9c71ae4b2d94a7deba9a16426aa6aec712
    spec:
      serviceAccountName: kuberight
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      initContainers:
        # Generates the proxy's session-cookie secret in memory, so no
        # Secret has to be created by hand.
        - name: proxy-cookie-secret
          image: "mohankrishna999/kuberight:0.1.0-rc.4"
          imagePullPolicy: IfNotPresent
          args: ["cookie-secret", "/var/run/kuberight-proxy/cookie-secret"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: proxy-session
              mountPath: /var/run/kuberight-proxy
      containers:
        - name: kuberight
          image: "mohankrishna999/kuberight:0.1.0-rc.4"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: api
              containerPort: 8080
              protocol: TCP
          env:
            - name: KUBERIGHT_LISTEN_ADDR
              # Only the sign-in proxy sidecar in this pod can reach the API.
              value: "127.0.0.1:8080"
            - name: KUBERIGHT_AUTH_MODE
              value: "openshift"
            - name: KUBERIGHT_OPERATION_MODE
              value: "recommend"
            - name: KUBERIGHT_INVENTORY_ENABLED
              value: "true"
            - name: KUBERIGHT_CLUSTER_ID
              value: "kuberight"
            - name: KUBERIGHT_INVENTORY_RESYNC
              value: "10m"
            - name: KUBERIGHT_KUBERNETES_QPS
              value: "50"
            - name: KUBERIGHT_KUBERNETES_BURST
              value: "100"
            - name: KUBERIGHT_PROMETHEUS_TIMEOUT
              value: "10s"
            - name: KUBERIGHT_PROMETHEUS_MAX_IN_FLIGHT
              value: "8"
            - name: KUBERIGHT_RECOMMENDATION_WINDOW
              value: "168h"
            - name: KUBERIGHT_RECOMMENDATION_STEP
              value: "5m"
            - name: KUBERIGHT_FORECAST_WINDOW
              value: "336h"
            - name: KUBERIGHT_FORECAST_STEP
              value: "1h"
            - name: KUBERIGHT_VERIFICATION_INTERVAL
              value: "15m"
            - name: KUBERIGHT_VERIFICATION_EARLY_INTERVAL
              value: "2m"
          startupProbe:
            httpGet:
              path: /healthz
              port: 4180
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: 4180
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4180
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            limits:
              cpu: 1
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        - name: oauth-proxy
          image: "registry.redhat.io/openshift4/ose-oauth-proxy-rhel9:latest"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          args:
            - --provider=openshift
            - --openshift-service-account=kuberight
            - --http-address=0.0.0.0:4180
            - --https-address=
            - --upstream=http://127.0.0.1:8080/
            - --cookie-secret-file=/var/run/kuberight-proxy/cookie-secret
            - --cookie-name=_kuberight
            - --cookie-secure=true
            - --cookie-expire=8h0m0s
            # KubeRight verifies this token and authorizes each request itself.
            - --pass-access-token=true
            - --skip-auth-regex=^/(healthz|readyz|metrics)$
            # Who may sign in at all.
            - '--openshift-sar={"namespace":"kuberight","resource":"services","resourceName":"kuberight","verb":"get"}'
            # API clients with their own bearer token skip the browser login.
            - '--openshift-delegate-urls={"/api/":{"name":"kuberight","namespace":"kuberight","resource":"services","verb":"get"}}'
          ports:
            - name: http
              containerPort: 4180
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /oauth/healthz
              port: 4180
            periodSeconds: 10
          volumeMounts:
            - name: proxy-session
              mountPath: /var/run/kuberight-proxy
              readOnly: true
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: proxy-session
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kuberight
              app.kubernetes.io/instance: kuberight
              app.kubernetes.io/component: server
      nodeSelector:
        kubernetes.io/os: linux
