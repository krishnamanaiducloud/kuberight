# Source: kuberight/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuberight
  namespace: kuberight
  labels:
    helm.sh/chart: kuberight-0.1.0-rc.9
    app.kubernetes.io/name: kuberight
    app.kubernetes.io/instance: kuberight
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.1.0-rc.9"
    app.kubernetes.io/component: server
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kuberight
      app.kubernetes.io/instance: kuberight
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kuberight
        app.kubernetes.io/instance: kuberight
        app.kubernetes.io/component: server
      annotations:
        checksum/config: 96438f4d01403610ce1e94698560db9c71ae4b2d94a7deba9a16426aa6aec712
    spec:
      serviceAccountName: kuberight
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: kuberight
          image: "mohankrishna999/kuberight:0.1.0-rc.9"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: KUBERIGHT_LISTEN_ADDR
              value: ":8080"
            # The Go runtime keeps its heap under 85% of this limit.
            - name: KUBERIGHT_MEMORY_LIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: kuberight
                  resource: limits.memory
            - name: KUBERIGHT_OPERATION_MODE
              value: "recommend"
            - name: KUBERIGHT_INVENTORY_ENABLED
              value: "true"
            - name: KUBERIGHT_CLUSTER_ID
              value: "kuberight"
            - name: KUBERIGHT_INVENTORY_RESYNC
              value: "10m"
            - name: KUBERIGHT_KUBERNETES_QPS
              value: "50"
            - name: KUBERIGHT_KUBERNETES_BURST
              value: "100"
            - name: KUBERIGHT_PROMETHEUS_TIMEOUT
              value: "10s"
            - name: KUBERIGHT_PROMETHEUS_MAX_IN_FLIGHT
              value: "8"
            - name: KUBERIGHT_RECOMMENDATION_WINDOW
              value: "168h"
            - name: KUBERIGHT_RECOMMENDATION_STEP
              value: "5m"
            - name: KUBERIGHT_DEFAULT_SCAN_INTERVAL
              value: "6h"
            - name: KUBERIGHT_FORECAST_WINDOW
              value: "336h"
            - name: KUBERIGHT_FORECAST_STEP
              value: "1h"
            - name: KUBERIGHT_VERIFICATION_INTERVAL
              value: "15m"
            - name: KUBERIGHT_VERIFICATION_EARLY_INTERVAL
              value: "2m"
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            limits:
              cpu: 1
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kuberight
              app.kubernetes.io/instance: kuberight
              app.kubernetes.io/component: server
      nodeSelector:
        kubernetes.io/os: linux

